name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          V="b${GITHUB_SHA::8}"
          mkdir -p "_site/$V"
          cp -r vendor _site/
          cp -r src "_site/$V/"
          cp style.css "_site/$V/style.css"
          sed -e "s#\./src/main.js#./$V/src/main.js#" -e "s#\./style.css#./$V/style.css#" index.html > _site/index.html
          touch _site/.nojekyll
          grep -n "$V" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
